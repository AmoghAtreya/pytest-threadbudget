[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-threadbudget"
version = "0.1.1"
description = "Opt-in native thread budgets for local pytest-xdist workers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Amogh Atreya"}]
dependencies = ["pytest>=8,<10", "threadpoolctl>=3.5,<4", "joblib>=1.4,<2"]
classifiers = ["Framework :: Pytest", "Development Status :: 3 - Alpha"]

[project.optional-dependencies]
test = ["pytest-xdist>=3.6,<4", "numpy>=1.26", "psutil>=5.9", "build>=1.2"]
benchmark = ["pytest-xdist>=3.6,<4", "psutil>=5.9"]
realrepos = ["numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "hypothesis>=6", "pandas>=2"]
release = ["build>=1.2", "twine>=6", "ruff>=0.11"]

[project.urls]
Homepage = "https://github.com/AmoghAtreya/pytest-threadbudget"
Repository = "https://github.com/AmoghAtreya/pytest-threadbudget"
Issues = "https://github.com/AmoghAtreya/pytest-threadbudget/issues"
Changelog = "https://github.com/AmoghAtreya/pytest-threadbudget/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
threadbudget = "pytest_threadbudget.plugin"

[project.scripts]
threadbudget-bench = "pytest_threadbudget.benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
